name: Rename space-2 to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f space-2.html ]; then
            git mv space-2.html index.html
            git config user.name "guigui950121"
            git config user.email "guigui950121@users.noreply.github.com"
            git commit -m "Rename space-2.html to index.html"
            git push
          else
            echo "space-2.html not found"
            exit 1
          fi
